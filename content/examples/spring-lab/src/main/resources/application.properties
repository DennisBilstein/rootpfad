spring.application.name=spring-lab

# Schema gehört Flyway; Hibernate prüft nur, ob Entities dazu passen.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Versionierung über Header "API-Version" (Spring Framework 7).
spring.mvc.apiversion.use.header=API-Version
spring.mvc.apiversion.supported=1.0,1.1
spring.mvc.apiversion.default=1.0

# Timeouts für alle automatisch konfigurierten HTTP-Clients (Spring Boot 4).
spring.http.clients.connect-timeout=1s
spring.http.clients.read-timeout=2s

lab.rates.base-url=https://rates.example.invalid
